name: Unity Validation

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  unity-tests:
    name: Unity ${{ matrix.testMode }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Unity licensing configuration
        run: |
          test -n "$UNITY_LICENSE" || { echo "::error::UNITY_LICENSE secret is not configured."; exit 1; }
          test -n "$UNITY_EMAIL" || { echo "::error::UNITY_EMAIL secret is not configured."; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo "::error::UNITY_PASSWORD secret is not configured."; exit 1; }

      - name: Run Unity ${{ matrix.testMode }} tests
        id: unity-test-runner
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: .
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unity ${{ matrix.testMode }} test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-${{ matrix.testMode }}-test-results
          path: ${{ steps.unity-test-runner.outputs.artifactsPath }}
